name: Build image and deploy

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  call-version-info-workflow:
    uses: ASFHyP3/actions/.github/workflows/reusable-version-info.yml@v0.21.1
    permissions:
      contents: read
    with:
      python_version: '3.12'

  dockerize:
    needs: call-version-info-workflow
    permissions:
      contents: read
      id-token: write
    uses: ASFHyP3/actions/.github/workflows/reusable-docker-ecr.yml@v0.22.0
    with:
      fetch_depth: 1
      aws_region: ${{ vars.AWS_REGION }}
      role_to_assume: ${{ vars.OIDC_ROLE_ARN }}
      ecr_registry: ${{ vars.ECR_REGISTRY }}
      version_tag: ${{ needs.call-version-info-workflow.outputs.version_tag }}
      build_args: "SETUPTOOLS_SCM_PRETEND_VERSION=${{ needs.call-version-info-workflow.outputs.version }}"
      platforms: 'linux/amd64'
      provenance: false


  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    concurrency:
      group: deploy-${{ contains(needs.call-version-info-workflow.outputs.version_tag, '.dev') && 'test' || 'prod' }}
    environment: ${{ contains(needs.call-version-info-workflow.outputs.version_tag, '.dev') && 'test' || 'prod' }}
    runs-on: ubuntu-latest
    needs:
      - call-version-info-workflow
      - dockerize
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: ./.github/actions/deploy
        with:
          STACK_NAME: ${{ vars.STACK_NAME }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          CF_TEMPLATE_BUCKET: cf-templates-1uzy61g1h6omf-us-west-2
          SENTINEL1_TOPIC_ARN: ${{ vars.SENTINEL1_TOPIC_ARN }}
          AOI_TOPIC_ARN: ${{ vars.AOI_TOPIC_ARN }}
          BUCKET_TOPIC_ARN: ${{ vars.BUCKET_TOPIC_ARN }}
          HYP3_API: ${{ vars.HYP3_API }}
          HYP3_JOBS_TABLE: ${{ vars.HYP3_JOBS_TABLE }}
          LAMBDA_LOGGING_LEVEL: INFO
          PUBLISH_BUCKET: ${{ vars.PUBLISH_BUCKET }}
          ECR_IMAGE_URI: ${{ needs.dockerize.outputs.image_uri }}
